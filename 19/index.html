<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>마이브이 뉴스로 이동 | MYV</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8faff;color:#182a49}
    main{text-align:center;padding:32px 20px;max-width:480px}
    a{color:#2278f9;font-weight:600}
  </style>
</head>
<body>
<main>
  <h1>마이브이 뉴스</h1>
  <p>이전 뉴스 주소를 새로운 브랜드 홈페이지 주소로 연결하고 있습니다.</p>
  <p><a id="newsLink" href="../news.html">마이브이 뉴스 바로가기</a></p>
</main>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const idx = params.get('idx');
  const fallback = new URL('../news.html', location.href);
  // Withdrawn shop announcement: do not show an article detail for this ID.
  if (idx === '175001347' || !idx || !/^\d+$/.test(idx)) {
    location.replace(fallback.href);
    return;
  }
  try {
    const response = await fetch('../news-posts.json', {cache:'no-store'});
    if (!response.ok) throw new Error('News index unavailable');
    const posts = await response.json();
    const post = posts.find(item => item.id === 'legacy-' + idx);
    if (post) {
      const target = new URL('../news.html', location.href);
      target.searchParams.set('article', post.id);
      location.replace(target.href);
      return;
    }
  } catch (_) {
    // On data failures, keep visitors on the live archive instead of a 404.
  }
  location.replace(fallback.href);
})();
</script>
</body>
</html>
