<style>
:root{--b:#2278F9;--navy:#162A66;--text:#101216;--line:#e7e9ee;--muted:#697487;--soft:#f5f7fa}

.test-logo{width:78px}.test-header-right{display:flex;align-items:center;gap:22px;font-size:13px;font-weight:650}

.intro{padding:68px 0 42px}.eyebrow{font-size:12px;letter-spacing:.15em;color:var(--b);font-weight:800;margin:0 0 14px}
.intro h1{font-size:clamp(32px,4vw,52px);line-height:1.2;letter-spacing:-.055em;margin:0 0 14px}
.intro p.desc{color:var(--muted);font-size:16px;margin:0}

.screen-heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:20px}.screen-heading h2{font-size:25px;letter-spacing:-.045em;margin:4px 0 7px}.screen-heading p{font-size:14px;color:var(--muted);margin:0}.screen-heading .index{font-size:12px;font-weight:800;letter-spacing:.13em;color:var(--b)}
.btn{padding:12px 19px;border-radius:9px;background:var(--b);color:white;border:1px solid var(--b);font-size:13px;font-weight:700}.btn.secondary{background:#fff;color:var(--navy);border-color:#dbe0e8}.btn.light{background:#edf4ff;color:var(--b);border-color:#edf4ff}

.workspace{padding:35px 38px 45px;min-width:0}.worktop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:30px}.worktop h3{font-size:24px;letter-spacing:-.045em;margin:0 0 5px}.worktop p{font-size:13px;color:#8993a5;margin:0}.worktop-actions{display:flex;gap:8px;align-items:center}
.status{background:#ebf7f0;color:#168252;font-size:12px;font-weight:700;padding:7px 12px;border-radius:40px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:22px}.metric{border:1px solid #e8ebf2;border-radius:13px;padding:22px;background:#fff}.metric label{display:block;color:#8290a3;font-size:12px;margin-bottom:11px}.metric strong{font-size:28px;letter-spacing:-.055em;line-height:1.2;display:block;color:#17254d}.metric small{font-size:11px;color:#188458}
.panel{border:1px solid #e8ebf2;border-radius:13px;background:#fff;overflow:hidden;margin-bottom:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:21px 23px;gap:10px}.panel-head strong{font-size:15px;letter-spacing:-.025em}.panel-head small{font-size:12px;color:#8d98a8}.padded{padding:0 23px 23px}
table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;background:#f7f9fc;color:#7d899a;font-weight:650;font-size:11px;padding:15px 16px;white-space:nowrap}td{padding:17px 16px;border-bottom:1px solid #f0f2f6;color:#354056}tr:last-child td{border-bottom:0}.mono{font-size:12px;color:#416bb5;word-break:break-all}.tag{display:inline-block;border-radius:40px;padding:5px 9px;background:#edf4ff;color:#2278f9;font-size:11px;font-weight:800}.tag.green{background:#eaf7ef;color:#188052}.tag.orange{background:#fff4e3;color:#ac731d}
.formrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{border:1px solid #dfe4ec;border-radius:9px;background:#fff;padding:12px 13px;color:#36445b;min-width:160px;flex:1;font-size:13px}.field:focus{outline:2px solid #b7d3ff}
.copybar{display:flex;gap:10px;align-items:center;background:#f7f9fd;padding:13px;border-radius:10px;min-width:0}.copybar code{font-size:12px;color:#2753a7;overflow-wrap:anywhere;flex:1}.notice{padding:13px 16px;background:#f5f8fe;border-left:3px solid var(--b);border-radius:5px;font-size:12px;color:#657187;margin-top:15px}

.receipt{width:min(520px,100%);border:1px solid #e5eaf1;border-radius:13px;margin:0 auto;background:#fff;padding:32px}.receipt-top{text-align:center;padding-bottom:22px;border-bottom:1px dashed #dce3ee}.receipt-top h4{font-size:20px;margin:7px 0}.receipt-row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;font-size:13px;color:#677489;border-bottom:1px solid #f0f2f6}.receipt-row strong{color:#202e48}.receipt-total{display:flex;justify-content:space-between;align-items:center;padding:25px 0;font-weight:800}.receipt-total strong{font-size:27px;color:var(--b)}

.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#142953;color:#fff;border-radius:9px;padding:13px 20px;font-size:13px;box-shadow:0 10px 35px #12285430;display:none;z-index:50}
@media(max-width:800px){.test-container,.test-head-inner{width:calc(100% - 30px)}.app{grid-template-columns:1fr}.sidebar{display:none}.workspace{padding:20px 14px}.metrics{grid-template-columns:1fr}.screen-heading,.worktop{align-items:start;flex-direction:column}.panel{overflow-x:auto}.panel table{min-width:630px}.timeline{flex-direction:column}.timeline span{width:100%}.test-header-right small{display:none}.tabbar button{padding:10px 12px}.intro{padding:40px 0 25px}}
@media print{.test-header,.intro,.tabbar,.footer,.screen-heading button,.toast{display:none!important}.screen{display:block!important;break-after:page;page-break-after:always;margin:0 0 22px}.app{box-shadow:none;min-height:620px}.test-container{width:100%}body{print-color-adjust:exact;-webkit-print-color-adjust:exact}}

<script>

function frame(i,inner){return `<section class="screen ${i===1?'active':''}" id="screen-${i}"><div class="screen-heading"><div><span class="index">FUNCTION 0${i}</span><h2>${pageTitles[i-1]}</h2><p>${pageDescriptions[i-1]}</p></div><button class="btn secondary" onclick="window.print()">화면 인쇄 / PDF 저장 ↗</button></div><div class="app"><aside class="sidebar"><img src="../assets/myv-logo.svg" width="70" alt="MYV"><div class="side-title">MYV WORKSPACE</div>${side.map((s,j)=>`<button class="side-link ${j===(i===1?1:i===2?2:i===5?4:3)?'active':''}" onclick="switchTab(${j===1?1:j===2?2:j===4?5:4})"><span class="side-icon">${s[0]}</span>${s[1]}</button>`).join('')}</aside><div class="workspace"><div class="worktop"><div><h3>${pageTitles[i-1]}</h3><p>MYV Platform / 기능 시연 환경</p></div><span class="status">● DEMO ACTIVE</span></div>${inner}</div></div></section>`}
const metrics=(a)=>`<div class="metrics">${a.map(x=>`<div class="metric"><label>${x[0]}</label><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}</div>`;

const table=(heads,rows)=>`<table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

const notice=(t)=>`<div class="notice">${t}</div>`;
const data=[
frame(1,metrics([['발급된 추천 링크','1,284','+12.8% 전주 대비'],['오늘 유입 클릭','328','+8.4% 전일 대비'],['DB 기록 성공률','100%','테스트 예시']])+panel('추천 링크 발급',`<div class="padded"><div class="formrow"><input id="ref-user" class="field" value="MYV-U1004" aria-label="사용자 식별자"><button class="btn" onclick="makeLink()">+ 추천 링크 생성</button></div><div class="copybar" style="margin-top:13px"><code id="generated-link">https://myv.co.kr/?ref=A7K29</code><button class="btn secondary" onclick="copyLink()">링크 복사</button></div>${notice('추천 URL을 통해 유입된 클릭은 사용자 식별자·유입 시각·추천 코드를 기준으로 기록되는 구조를 표현했습니다.')}</div>`)+panel('최근 유입 로그',table(['사용자 ID','추천 코드','유입 경로','접속 시각','DB 적재'],users.map(u=>[u[0],`<span class="mono">${u[1]}</span>`,'추천 URL',u[3],'<span class="tag green">정상 적재</span>'])))),
frame(2,metrics([['결제 완료 건','186','당일 집계'],['추천 유입 연결','154','매칭률 82.8%'],['매칭 대기','32','확인 필요']])+panel('구매 전환 매칭 프로세스',`<div class="padded"><div class="timeline"><span>① 추천 URL 클릭<br><small>REF-A7K29</small></span><b>→</b><span>② 주문 및 결제 완료<br><small>ORD-261028-001</small></span><b>→</b><span>③ 추천인 자동 매칭<br><small>MYV-U1001</small></span></div>${notice('추천 코드와 결제 주문을 연계하는 데이터 구조의 예시입니다. 실시간 결제 연동 완료 증빙은 별도 로그가 필요합니다.')}</div>`)+panel('결제 및 추천인 매칭 내역',table(['주문번호','결제금액','추천 코드','추천인 ID','처리 상태'],[['ORD-261028-001','₩ 120,000','REF-A7K29','MYV-U1001','<span class="tag green">매칭 완료</span>'],['ORD-261028-002','₩ 89,000','REF-B2M18','MYV-U1002','<span class="tag green">매칭 완료</span>'],['ORD-261028-003','₩ 65,000','—','미확인','<span class="tag orange">확인 대기</span>'],['ORD-261028-004','₩ 210,000','REF-C5P66','MYV-U1003','<span class="tag green">매칭 완료</span>']]))),
frame(3,metrics([['정산 대상 구매액','₩ 1,200,000','테스트 주문 기준'],['기여 보상 총액','₩ 120,000','예시 요율 10%'],['원천징수 공제','₩ 3,960','예시 공제율 3.3%']])+panel('기여도별 정산 산출',`<div class="padded"><div class="formrow"><label style="font-size:13px;color:#657083">구매 금액 <input id="amount" type="number" class="field" value="120000" min="0" style="width:170px;flex:none"></label><label style="font-size:13px;color:#657083">기여율(%) <input id="rate" type="number" class="field" value="10" min="0" max="100" style="width:120px;flex:none"></label><button class="btn" onclick="calc()">정산 금액 산출</button></div><div class="timeline"><span>구매 금액<br><strong id="calc-base">₩ 120,000</strong></span><b>×</b><span>기여 비율<br><strong id="calc-rate">10%</strong></span><b>→</b><span>정산 예정액<br><strong id="calc-total">₩ 11,604</strong></span></div>${notice('시연용 가정: 보상액 = 결제금액 × 기여율, 지급예정액 = 보상액 − 예시 원천징수 3.3%. 실제 적용 요율 및 세무 기준은 계약·법령 확인이 필요합니다.')}</div>`)+panel('정산 산출 상세 내역',table(['구분','산출 기준','금액'],[['상품 구매액','결제 완료 금액','₩ 120,000'],['기여 보상액','₩ 120,000 × 10%','₩ 12,000'],['원천징수 예시','₩ 12,000 × 3.3%','− ₩ 396'],['최종 지급 예정액','보상액 − 공제액','<strong style="color:#2278f9">₩ 11,604</strong>']]))),
frame(4,metrics([['누적 기여 보상','₩ 486,500','전체 누적'],['정산 완료 금액','₩ 350,000','이전 지급분'],['정산 예정 금액','₩ 136,500','다음 정산 회차']])+panel('나의 정산 현황',`<div class="padded"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><p style="color:#8390a3;font-size:12px;margin:0 0 8px">MYV-U1001 · 2026년 10월 정산</p><strong style="font-size:32px;letter-spacing:-.06em;color:#162A66">₩ 136,500</strong><div style="margin-top:8px"><span class="tag">정산 예정</span></div></div><button class="btn" onclick="openReceipt()">정산서 확인 및 인쇄 ↗</button></div></div>`)+panel('기간별 정산 목록',table(['정산 기간','기여 매출','정산액','지급 상태'],[['2026.10','₩ 1,365,000','₩ 136,500','<span class="tag">정산 예정</span>'],['2026.09','₩ 1,900,000','₩ 190,000','<span class="tag green">지급 완료</span>'],['2026.08','₩ 1,600,000','₩ 160,000','<span class="tag green">지급 완료</span>']]))),
frame(5,metrics([['정산 승인 대기','12건','검토 대상'],['승인 완료','84건','이달 누적'],['당월 지급 예정액','₩ 8,420,000','예시 집계']])+panel('기간별 정산 통계',bars([28,47,39,67,58,83,72,91],['10.01','10.05','10.09','10.13','10.17','10.21','10.25','10.28']),'2026년 10월 · 처리 건수')+panel('관리자 정산 검토',`<div id="approval-table">${table(['정산 ID','사용자','지급 예정액','처리 상태','관리'],[['SET-1028-001','MYV-U1001','₩ 136,500','<span class="tag orange">승인 대기</span>','<button class="btn light" onclick="decide(this,true)">승인</button> <button class="btn secondary" onclick="decide(this,false)">반려</button>'],['SET-1028-002','MYV-U1002','₩ 89,300','<span class="tag orange">승인 대기</span>','<button class="btn light" onclick="decide(this,true)">승인</button> <button class="btn secondary" onclick="decide(this,false)">반려</button>'],['SET-1028-003','MYV-U1003','₩ 72,800','<span class="tag green">승인 완료</span>','처리 완료']])}</div>`))

function switchTab(n){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id==='screen-'+n));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',Number(b.dataset.tab)===n));window.scrollTo({top:0,behavior:'smooth'});history.replaceState(null,'','#function-'+n)}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>switchTab(Number(b.dataset.tab))));
function toast(t){let x=document.querySelector('#toast');x.textContent=t;x.style.display='block';clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>x.style.display='none',2500)}
function makeLink(){let s=document.getElementById('ref-user').value.trim();if(!s)return toast('사용자 식별자를 입력해주세요');let code='DEMO-'+s.replace(/[^a-z0-9]/gi,'').slice(-8).toUpperCase();document.getElementById('generated-link').textContent='https://myv.co.kr/?ref='+code;toast('시연용 링크가 생성되었습니다 (DB 미연결)')}
async function copyLink(){try{await navigator.clipboard.writeText(document.getElementById('generated-link').textContent);toast('링크를 복사했습니다')}catch(e){toast('링크를 선택해 직접 복사해주세요')}}
function won(n){return '₩ '+Math.round(n).toLocaleString('ko-KR')}
function calc(){let a=Math.max(0,Number(document.getElementById('amount').value)||0),r=Math.min(100,Math.max(0,Number(document.getElementById('rate').value)||0));document.getElementById('calc-base').textContent=won(a);document.getElementById('calc-rate').textContent=r+'%';document.getElementById('calc-total').textContent=won(a*r/100*.967);toast('시연 기준으로 금액을 재계산했습니다')}
